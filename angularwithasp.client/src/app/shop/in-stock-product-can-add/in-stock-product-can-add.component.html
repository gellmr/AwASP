<div class="row inStockProductCanAdd" *ngIf="product">
  <div class="col-12 productDetailsFlex">
    <div class="row">
      <div class="col-4 col-md-3 col-lg-4 mgImgThumb">
        <img [src]="product.image" alt="Product Image" />
      </div>
      <div class="col-8 col-md-9 col-lg-8">
        <div class="productDetails">
          <h5>{{product.title}}&nbsp;<span class="inStockPrice">${{product.price}}</span></h5>
          <span>{{product.description}}</span>
        </div>
      </div>
      <div class="col-12 flexContAddToCart">
        <span class="d-none d-sm-block" style="text-align: right; font-size: 13px; padding-right: 7px; margin-left: 0px">Add to Cart</span>
        <span class="d-block d-sm-none" style="text-align: right; font-size: 13px; padding-right: 7px">Add to Cart</span>
        <div class="btn-group addToCartBtnGroup" role="group">
          <button disabled class="btn btn-success currentlyAdded" style="border-radius:4px; font-size:14px; font-weight:500">
            <span *ngIf="qtyInCart === 0">&nbsp;&nbsp;</span>
            <span *ngIf="qtyInCart > 0">{{qtyInCart}}</span>
          </button>
          <button class="btn btn-light" style="border-top-left-radius: 4px; border-bottom-left-radius: 4px" (click)="decrementQty()">
            <i class="bi bi-dash" style="font-size: 15px"></i>
          </button>
          <button class="btn btn-light" (click)="incrementQty()">
            <i class="bi bi-plus" style="font-size: 15px"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
