<div class="row" *ngIf="cartLine">
  <div class="col-12 inCartProd">
    <div class="row innerRow">

      <div class="col-9 col-sm-7">
        <div class="row">
          <div class="col-12">
            <div [attr.data-product-id]="cartLine.cartLineID" class="inCartItemText">
              <h6>
                {{ cartLine.isp.title }} ${{ cartLine.isp.price }}
              </h6>
            </div>
          </div>
          <div class="col-12" style="text-align: left; font-size: 13px; display: flex; justify-content: flex-start;">
            <p style="margin-top: 0; margin-bottom: 8px;">{{ cartLine.isp.description }}</p>
          </div>
          <div class="col-12 d-flex d-sm-none" style="justify-content: left;">
            <img [src]="cartLine.isp.image" class="rounded cartPicture cartSmallPicture" alt="Product Image" />
          </div>
        </div>
      </div>

      <div class="col-2 d-none d-sm-block">
        <img [src]="cartLine.isp.image" class="rounded cartPicture" alt="Product Image" />
      </div>

      <div class="col-3" style="text-align: right; display: flex; justify-content: flex-end; font-size: 12px;">
        <div class="row">
          <div class="col-12">
            <span class="d-block d-sm-none cartQtyXXs">Qty:</span>
            <span class="cartQtyXs d-block d-sm-none">Quantity:</span>
            <span class="d-none d-sm-block">Quantity:</span>
            &nbsp;
            <span style="font-weight: 500;">{{ cartLine.qty }}</span>
          </div>
          <div class="col-12 cartLineSubInfoBottom">
            <div style="text-align: right;">Price: ${{ cartLine.isp.price * cartLine.qty }}</div>
          </div>
        </div>
      </div>

      <div class="col-12 inCartItemRemove">
        <div class="btn-group addToCartBtnGroup" role="group">
          <button class="btn btn-light btn-sm" style="font-size: 12px; width: 60px;" (click)="remove()">Remove</button>
          <button class="btn btn-light btn-sm" (click)="decrement()">
            <i class="bi bi-dash" style="font-size: 15px;"></i>
          </button>
          <button class="btn btn-light btn-sm" (click)="increment()">
            <i class="bi bi-plus" style="font-size: 15px;"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
